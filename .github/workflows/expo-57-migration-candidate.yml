name: Expo 57 migration candidate

on:
  push:
    branches:
      - chore/expo-sdk-57-migration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install current locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Expo SDK 57 dependency candidate
        env:
          CI: "1"
        run: |
          npx expo install expo@^57.0.9 --fix
          npx expo install --fix
      - name: Preserve generated manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-57-generated-manifests
          path: |
            package.json
            package-lock.json
          retention-days: 14
      - name: Typecheck candidate
        run: npx tsc --noEmit
      - name: Expo Doctor candidate
        run: npx expo-doctor
      - name: Candidate diff summary
        if: always()
        run: git diff --stat && git diff -- package.json | head -200

      - name: Commit verified Expo 57 manifests to migration branch
        if: success() && github.ref == 'refs/heads/chore/expo-sdk-57-migration'
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Manifests already match the validated candidate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: apply validated Expo SDK 57 dependency manifests"
          git push origin HEAD:chore/expo-sdk-57-migration
