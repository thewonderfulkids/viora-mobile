name: Expo 57 migration validation

on:
  push:
    branches:
      - chore/expo-sdk-57-migration
  pull_request:
    branches:
      - fix/phase-a-critical-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify Expo SDK 57 dependency alignment
        run: |
          node -e "const p=require('./package.json'); if (!p.dependencies.expo.startsWith('^57.')) process.exit(1); if (p.dependencies['react-native'] !== '0.86.3') process.exit(1)"
          CI=1 npx expo install --check
      - name: Android preview APK configuration preflight
        run: |
          npx expo config --type public --json > /tmp/viora-expo-public-config.json
          node <<'NODE'
          const fs = require('node:fs');
          const app = JSON.parse(fs.readFileSync('/tmp/viora-expo-public-config.json', 'utf8'));
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const assert = (ok, message) => { if (!ok) throw new Error(message); };
          assert(app.android?.package === 'com.drdigiweb.vioramobile', 'Android package missing or changed');
          assert(app.extra?.eas?.projectId === 'd459f525-122a-4265-b496-6b2bf0f2211c', 'EAS project ID missing or changed');
          assert(eas.build?.preview?.distribution === 'internal', 'Preview build must be internal');
          assert(eas.build?.preview?.android?.buildType === 'apk', 'Preview build must produce an APK');
          assert(eas.build?.production?.android?.buildType === 'app-bundle', 'Production build configuration unexpectedly changed');
          console.log('Android preview APK config preflight passed; this does not build an APK.');
          NODE
      - name: Mobile TypeScript
        run: npx tsc --noEmit
      - name: Offline regression tests
        run: node --test tests/account-deletion-execution.test.cjs tests/syncQueueRepository.test.cjs tests/coachVoiceInput.test.cjs tests/coachRetry.test.cjs tests/coachRequestContract.test.cjs tests/notificationTap.test.cjs tests/coachHttpErrors.test.cjs tests/stepCounterSession.test.cjs tests/authProviderSession.test.cjs tests/profilePhotoSession.test.cjs tests/yogaPlayback.test.cjs
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Install Firebase Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund
      - name: Firebase Functions TypeScript
        run: npm run build --prefix functions
