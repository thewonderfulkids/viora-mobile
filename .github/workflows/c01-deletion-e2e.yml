name: C01 deletion emulator E2E
on:
  push:
    branches: [chore/expo-sdk-57-migration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deletion-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-viora-deletion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix functions --no-audit --no-fund
      - run: npm run build --prefix functions
      - run: |
          printf '%s\n' '{"emulators":{"auth":{"host":"127.0.0.1","port":9099},"firestore":{"host":"127.0.0.1","port":8080},"storage":{"host":"127.0.0.1","port":9199},"ui":{"enabled":false}},"firestore":{"rules":"firestore.rules"},"storage":{"rules":"storage.rules"}}' > firebase.c01.json
          npx --yes firebase-tools@latest emulators:exec --config firebase.c01.json --project demo-viora-deletion --only auth,firestore,storage "node --test functions/tests/deletion-emulator.cjs functions/tests/storage-freeze.test.cjs"
