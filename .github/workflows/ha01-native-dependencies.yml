name: HA01 native dependency resolution
on:
  push:
    branches: [chore/expo-sdk-57-migration]
    paths: ['.github/workflows/ha01-native-dependencies.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resolve:
    if: github.ref == 'refs/heads/chore/expo-sdk-57-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve matching native Firebase packages
        run: |
          VERSION="$(npm view @react-native-firebase/app-check version)"
          npm install --save-exact --package-lock-only --ignore-scripts "@react-native-firebase/app@$VERSION" "@react-native-firebase/app-check@$VERSION"
          npm ci
      - name: Validate dependencies
        run: |
          npx tsc --noEmit
          npx expo config --type public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ha01-native-dependency-files
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
      - name: Persist validated dependency files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(P1-HA01): lock native Firebase App Check dependencies'
          git push origin HEAD:refs/heads/chore/expo-sdk-57-migration
