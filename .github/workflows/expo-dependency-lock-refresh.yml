name: Expo dependency lock refresh (one-time)

on:
  push:
    branches:
      - chore/expo-sdk-57-migration

permissions:
  contents: write

jobs:
  refresh-lock:
    if: contains(github.event.head_commit.message, '[refresh-expo-lock]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate lockfile using npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile consistency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(expo): synchronize SDK 57 lockfile"
          git push origin HEAD:chore/expo-sdk-57-migration
