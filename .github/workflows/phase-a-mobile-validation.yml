name: Phase A mobile validation

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "functions/**"
      - ".github/workflows/phase-a-mobile-validation.yml"
  push:
    branches:
      - "fix/phase-a-critical-hardening"
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "functions/**"
      - ".github/workflows/phase-a-mobile-validation.yml"

permissions:
  contents: read

jobs:
  typecheck:
    name: Mobile TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npx tsc --noEmit

  functions-typecheck:
    name: Firebase Functions TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund
      - name: Compile Functions
        run: npm run build --prefix functions

  expo-doctor:
    name: Expo SDK compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Expo Doctor (strict)
        run: npx expo-doctor
